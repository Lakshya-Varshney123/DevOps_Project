<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBite Food Ordering</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#252941;font:16px Arial,sans-serif}header{padding:36px 7%;background:linear-gradient(120deg,#252943,#59648c);color:white}header small{color:#ffc0ae;letter-spacing:2px;text-transform:uppercase}h1{font-size:42px;margin:10px 0}main{max-width:1100px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.panel{background:white;border-radius:15px;padding:22px;box-shadow:0 8px 25px #20243710}h2{margin-top:0}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{border:1px solid #e8eaf1;padding:15px;border-radius:12px}.item p{color:#697087;font-size:14px;min-height:34px}.price{color:#f06445;font-weight:bold}button{background:#f06445;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}input{width:100%;padding:11px;border:1px solid #dfe2eb;border-radius:8px;margin:7px 0 12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.msg{background:#fff0eb;padding:12px;border-radius:8px;margin-top:12px;color:#98402b}.muted{color:#777;font-size:14px}@media(max-width:750px){main{grid-template-columns:1fr}h1{font-size:32px}}
</style></head><body><header><small>Microservices food platform</small><h1>Good food. Zero fuss.</h1><p>Choose your favourites and place a demo order with QuickBite.</p></header>
<main><section class="panel"><h2>Today's menu</h2><div id="menu" class="muted">Loading menu…</div></section><aside>
<section class="panel"><h2>Your cart</h2><div id="cart" class="muted">Your cart is empty.</div><form id="form"><label>Your name</label><input id="customer" required placeholder="Enter your name"><label>Delivery address</label><input id="address" required placeholder="Enter delivery address"><button id="place" style="width:100%">Place demo order</button></form><div id="message"></div></section>
<section class="panel" style="margin-top:18px"><h2>Recent orders</h2><div id="orders" class="muted">Loading…</div><button id="refresh" style="margin-top:12px">Refresh orders</button></section></aside></main>
<script>
let menuItems=[],cart={};const money=n=>'₹'+Number(n).toFixed(0);
async function loadMenu(){try{let r=await fetch('/api/menu');if(!r.ok)throw 0;menuItems=await r.json();document.getElementById('menu').innerHTML='<div class="menu">'+menuItems.map(x=>`<article class="item"><h3>${x.name}</h3><p>${x.description}</p><div class="row"><b class="price">${money(x.price)}</b><button onclick="add(${x.id})">Add</button></div></article>`).join('')+'</div>'}catch(e){document.getElementById('menu').textContent='Menu service unavailable.'}}
function add(id){cart[id]=(cart[id]||0)+1;drawCart()}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];drawCart()}
function drawCart(){let el=document.getElementById('cart'),ids=Object.keys(cart);if(!ids.length){el.textContent='Your cart is empty.';return}let total=0;el.innerHTML=ids.map(id=>{let x=menuItems.find(i=>i.id==id),s=x.price*cart[id];total+=s;return `<div class="row"><span>${x.name} × ${cart[id]}<br>${money(s)}</span><span><button onclick="change(${id},-1)">−</button> <button onclick="change(${id},1)">+</button></span></div>`}).join('')+`<div class="row"><b>Total</b><b>${money(total)}</b></div>`}
async function loadOrders(){try{let r=await fetch('/api/orders'),d=await r.json();if(!r.ok)throw 0;document.getElementById('orders').innerHTML=d.length?d.slice().reverse().slice(0,5).map(o=>`<div class="row"><span>#${o.id} · ${o.customer}<br><small>${o.status}</small></span><b>${money(o.total)}</b></div>`).join(''):'No orders yet.'}catch(e){document.getElementById('orders').textContent='Could not load orders.'}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();let ids=Object.keys(cart);if(!ids.length){document.getElementById('message').textContent='Add an item first.';return}let b=document.getElementById('place');b.disabled=true;try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:customer.value.trim(),address:address.value.trim(),items:ids.map(id=>({id:+id,quantity:cart[id]}))})}),d=await r.json();if(!r.ok)throw Error(d.error||'Order failed');document.getElementById('message').innerHTML=`<div class="msg">Order #${d.id} confirmed! Total ${money(d.total)}. Payment: ${d.payment_status}.</div>`;cart={};drawCart();loadOrders()}catch(err){document.getElementById('message').innerHTML=`<div class="msg">${err.message}</div>`}finally{b.disabled=false}};
document.getElementById('refresh').onclick=loadOrders;loadMenu();loadOrders();
</script></body></html>
